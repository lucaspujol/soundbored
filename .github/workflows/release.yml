name: Release

on:
  # pushing a tag like v0.1.0 builds and publishes a GitHub Release
  push:
    tags: ['v*']
  # manual run from the Actions tab: builds the packages without publishing anything
  workflow_dispatch:
  # also on PRs touching the release setup, so packaging breaks show up before a real release
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CMakeLists.txt

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 on purpose: its older glibc (2.35) lets the binary run on more distros
          - { name: Linux,   os: ubuntu-22.04,   platform: linux-x64 }
          - { name: Windows, os: windows-latest, platform: windows-x64 }
    defaults:
      run:
        shell: bash
    steps:
      # full history, so the tag check below can see main
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the tag is the version: v0.2.0 -> 0.2.0. Untagged runs get dev-<commit>
      - name: Read version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # before the build, so a bad tag fails in seconds.
      # On main = went through a PR and its CI checks
      - name: Check tag
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that isn't on main"
            exit 1
          fi

      # 22.04's default GCC 11 has no <format>: GCC 13 comes from the toolchain PPA
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13 libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      # GCC 13's libstdc++ is newer than what most distros ship, so it goes inside the binary
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      # the app loads assets/ next to the executable, so both go in the same folder
      - name: Package
        run: |
          name="soundbored-$VERSION-${{ matrix.platform }}"
          mkdir -p "dist/soundbored"
          cp -r assets LICENSE "dist/soundbored/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp soundbored.exe "dist/soundbored/"
            (cd dist && 7z a "$name.zip" soundbored)
          else
            cp soundbored "dist/soundbored/"
            tar -czf "dist/$name.tar.gz" -C dist soundbored
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # lets users check their download isn't corrupted: sha256sum -c SHA256SUMS
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # --generate-notes lists the PRs merged since the previous tag
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
